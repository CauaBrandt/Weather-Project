<!DOCTYPE html>
<html>
    <head>
        <title>Weather</title>

        <link rel="stylesheet" href="../styles/general.css">
        <link rel="stylesheet" href="../styles/header.css">
        <link rel="stylesheet" href="../styles/daily_info.css">

        <!-- Get Roboto Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    </head>
    <body>
        <header class="header">
            <div class="search-bar-container">
                <input class="search-bar" type="text" placeholder="Search">
            </div>
        </header>
        <main class="info">
            <div class="current-weather-container">
                <p class="current-weather-text">Current weather</p>
                <p class="city">Maricá, Rio de Janeiro, Brasil</p>
                <p class="date">16.09.2026</p>
            </div>
            <div class="daily-info">
                <img class="weather-image" src="">
                <div class="daily-weather-info">
                    <p class="weather-code">Sunny</p>
                    <div class="temperature-container">
                        <p class="temperature">19 &#176;C</p>
                        <p class="apparent-temperature">Feels like <span>14 &#176;C</span></p>
                    </div>
                </div>                
            </div>
        </main>
    </body>
</html>
