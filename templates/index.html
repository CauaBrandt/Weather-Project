<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title data-i18n="pageTitle">Weather</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='styles/general.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/header.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/daily_info.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/graph.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/forecast.css') }}">

        <!-- Get Roboto Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        
        <!-- Get LeafLet CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>

        <!-- Get Chart lib -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>
        <header id="header">
            <div id="left">
                <select id="lang-select" aria-label="Language">
                    <option value="en">En</option>
                    <option value="de">De</option>
                    <option value="pt-BR">Pt-BR</option>
                </select>
            </div>
            <div id="middle">
                <form id="search-bar-container">
                    <input id="search-bar" type="text" placeholder="Search" data-i18n-placeholder="search">
                    <ul id="city-list"></ul>
                </form>
            </div>
            <div id="right">
                <button id="degree-change">
                    <p class="degree">&#176;C</p>
                    <img src="{{ url_for('static', filename='Icons/DownArrow.svg') }}">
                </button>
            </div>
        </header>
        <main id="info">
            <div id="current-weather-container">
                <p id="current-weather-text" data-i18n="currentWeather">Current weather</p>
                <p id="city"></p>
                <p id="date"></p>
            </div>
            <div id="daily-info">
                <img id="weather-image">
                <div id="daily-weather-info">
                    <div id="sun-rise-set">
                        <p id="weather-condition"></p>
                        <div class="suntime">
                            <img src="{{ url_for('static', filename='Icons/Sunrise.svg') }}">
                            <div>                                
                                <p class="sunhour" data-i18n="sunrise">Sunrise</p>
                                <p id="sunrise"></p>
                            </div>
                        </div>
                        <div class="suntime" >
                            <img src="{{ url_for('static', filename='Icons/Sunset.svg') }}">
                            <div>                                
                                <p class="sunhour" data-i18n="sunset">Sunset</p>
                                <p id="sunset"></p>
                            </div>
                        </div>
                    </div>
                    <div id="temperature-container">
                        <button id="temperature"></button>
                        <p id="apparent-temperature" data-i18n="feelsLike">Feels like</p>
                        <button id="apparent-temperature-button"></button>
                    </div>
                </div>
            </div>
            <div id="chart-container">
                <div id="chart-scroller">
                    <div id="chart-inner">
                        <canvas id="chart"></canvas>
                    </div>
                </div>
                <div id="extra-info">
                    <button id="uv-index">UV Index: </button>
                    <button id="humidity">Humidity: &#37;</button>
                    <button id="precipitation">Precipitation:  mm</button>
                    <button id="visibility">Visibility:  Km</button>
                    <button id="wind-speed">Wind Speed:  Km/h <span id="wind-dir-arrow"></span><span id="wind-direction"></span></button>
                </div>
            </div>
            <div id="forecast-map">
                <div id="forecast"></div>
                <div id="map"></div>                
            </div>
        </main>
    </body>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        // Folder where the translation files live
        window.LANG_PATH = "{{ url_for('static', filename='lang') }}";
    </script>
    <script src="{{ url_for('static', filename='Scripts/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/header.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/data.js') }}"></script>
</html>
