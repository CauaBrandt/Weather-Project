<DOCTYPE html>
<html>
    <script src="{{ url_for('static', filename='Scripts/data.js') }}"></script>
    <script>
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                fetch(`/search_city?lat=${lat}&lon=${lon}`)
                .then((res) => res.json())
                .then((data) => {
                    console.log(data);
                    changeCity(data[1], data[2])
                });
            },
            (error) => {
                // Default city
                changeCity(-23.5329, -46.6395)
            }
        );
    </script>
</html>
