<!DOCTYPE html>
<html>
    <head>
        <title>Weather</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='styles/general.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/header.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/daily_info.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/graph.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/forecast.css') }}">

        <!-- Get Roboto Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        
        <!-- Get LeafLet CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>

        <!-- Get Chart lib -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>
        <header id="header">
            <div id="left"></div>
            <div id="middle">
                <form id="search-bar-container">
                    <input id="search-bar" type="text" placeholder="Search">
                    <ul id="city-list"></ul>
                </form>
            </div>
            <div id="right">
                <button id="degree-change">
                    <p class="degree">&#176;C</p>
                    <img src="{{ url_for('static', filename='Icons/DownArrow.svg') }}">
                </button>
            </div>
        </header>
        <main id="info">
            <div id="current-weather-container">
                <p id="current-weather-text">Current weather</p>
                <p id="city"></p>
                <p id="date"></p>
            </div>
            <div id="daily-info">
                <img id="weather-image" src="">
                <div id="daily-weather-info">
                    <p id="weather-code"></p>
                    <div id="temperature-container">
                        <button id="temperature"></button>
                        <p id="apparent-temperature">Feels like</p>
                        <button id="apparent-temperature-button"></button>
                    </div>
                </div>
            </div>
            <div id="chart-container">
                <div id="chart-scroller">
                    <div id="chart-inner">
                        <canvas id="chart"></canvas>
                    </div>
                </div>
                <div id="extra-info">
                    <button id="humidity">Humidity: &#37;</button>
                    <button id="precipitation">Precipitation:  mm</button>
                    <button id="visibility">Visibility:  Km</button>
                    <button id="wind-speed">Wind Speed:  Km/h <span id="wind-dir-arrow"></span><span id="wind-direction"></span></button>
                </div>
            </div>
            <div id="forecast-map">
                <div id="forecast"></div>
                <div id="map"></div>                
            </div>
        </main>
    </body>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="{{ url_for('static', filename='Scripts/header.js') }}"></script>
    <script src="{{ url_for('static', filename='Scripts/data.js') }}"></script>
</html>
